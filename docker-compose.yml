services:
  db:
    build: ./database
    container_name: simi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: simi_erp
      POSTGRES_USER: simi_user
      POSTGRES_PASSWORD: simi_pass
    volumes:
      - simi_pgdata:/var/lib/postgresql/data
    networks:
      - simi-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simi_user -d simi_erp"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: simi-frontend
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: simi_erp
      DB_USER: simi_user
      DB_PASSWORD: simi_pass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - simi-net

volumes:
  simi_pgdata:

networks:
  simi-net:
    driver: bridge
